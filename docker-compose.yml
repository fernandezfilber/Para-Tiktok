services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      PORT: 3001
      NODE_ENV: production
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_OTP_TEMPLATE: ${WHATSAPP_OTP_TEMPLATE:-filber_otp}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-es}
      CONTACT_WHATSAPP: ${CONTACT_WHATSAPP:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "3001"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=shared-infra"
      - "traefik.http.routers.filber.rule=Host(`${DOMAIN:-filber.tech}`)"
      - "traefik.http.routers.filber.entrypoints=websecure"
      - "traefik.http.routers.filber.tls=true"
      - "traefik.http.routers.filber.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.filber-http.rule=Host(`${DOMAIN:-filber.tech}`)"
      - "traefik.http.routers.filber-http.entrypoints=web"
      - "traefik.http.routers.filber-http.middlewares=filber-https"
      - "traefik.http.middlewares.filber-https.redirectscheme.scheme=https"
      - "traefik.http.services.filber.loadbalancer.server.port=3001"
    networks:
      - shared-infra

networks:
  shared-infra:
    external: true
    name: shared-infra